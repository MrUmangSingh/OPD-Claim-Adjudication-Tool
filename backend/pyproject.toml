[project]
name = "opd-claim-adjudication-backend"
version = "0.1.0"
description = "OPD Claim Adjudication Tool - Backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "anthropic>=0.40.0",
    "langchain-anthropic>=0.3.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.0.0",
    "pillow>=10.0.0",
    "reportlab>=4.0.0",
    "rapidfuzz>=3.0.0",
    "aiofiles>=23.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
